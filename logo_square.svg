<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <rect width="1000" height="1000" fill="#fafaf8"/>
  <defs>
    <radialGradient id="fade" cx="50%" cy="68%" r="32%">
      <stop offset="0%" stop-color="#fafaf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fafaf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 11 rings cx=500 cy=400 -->
  <circle cx="500" cy="400" r="340" fill="none" stroke="#ede9f8" stroke-width="5"/>
  <circle cx="500" cy="400" r="309" fill="none" stroke="#ddd4f2" stroke-width="5.5"/>
  <circle cx="500" cy="400" r="278" fill="none" stroke="#cec0ec" stroke-width="6"/>
  <circle cx="500" cy="400" r="247" fill="none" stroke="#beace6" stroke-width="6.5"/>
  <circle cx="500" cy="400" r="216" fill="none" stroke="#ae98e0" stroke-width="7"/>
  <circle cx="500" cy="400" r="185" fill="none" stroke="#9e84da" stroke-width="7.5"/>
  <circle cx="500" cy="400" r="154" fill="none" stroke="#8e70d4" stroke-width="8"/>
  <circle cx="500" cy="400" r="123" fill="none" stroke="#7e5cce" stroke-width="9"/>
  <circle cx="500" cy="400" r="92"  fill="none" stroke="#6e48c8" stroke-width="10"/>
  <circle cx="500" cy="400" r="61"  fill="none" stroke="#5e38c0" stroke-width="11"/>
  <circle cx="500" cy="400" r="30"  fill="none" stroke="#4a3cc8" stroke-width="12"/>

  <!-- Center dot -->
  <circle cx="500" cy="400" r="14" fill="#4a3cc8"/>

  <!-- Fade under text -->
  <ellipse cx="500" cy="570" rx="220" ry="90" fill="url(#fade)"/>

  <!-- P₁₁ = P₀ -->
  <text x="500" y="610" font-family="Georgia, serif" font-size="48" font-style="italic" fill="#4a3cc8" text-anchor="middle">P₁₁ = P₀</text>

  <!-- Full name -->
  <text x="500" y="710" font-family="Georgia, serif" font-size="62" font-style="italic" fill="#1a1a2e" text-anchor="middle">A Resonant Hierarchy</text>
  <text x="500" y="778" font-family="Georgia, serif" font-size="62" font-style="italic" fill="#1a1a2e" text-anchor="middle">of <tspan fill="#4a3cc8">Everything</tspan></text>

  <!-- tagline -->
  <text x="500" y="840" font-family="Arial, sans-serif" font-size="24" fill="#8a8aaa" text-anchor="middle" letter-spacing="5">ONE FORMULA · ALL SCALES</text>
</svg>
